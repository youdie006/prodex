name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  release-verify:
    name: release verification (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 / Node.js 20
            os: ubuntu-24.04
            node: 20
          - name: Ubuntu 24.04 / Node.js 22
            os: ubuntu-24.04
            node: 22
          - name: Ubuntu 24.04 / Node.js 24
            os: ubuntu-24.04
            node: 24
          - name: macOS 15 arm64 / Node.js 22
            os: macos-15
            node: 22
          - name: macOS 15 Intel / Node.js 22
            os: macos-15-intel
            node: 22
          - name: Windows Server 2025 x64 / Node.js 22
            os: windows-2025
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Print runtime environment
        run: node -e "console.log('node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch)"

      - name: Ensure ripgrep is installed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          # Package mirrors fail transiently; one bad fetch used to fail the run.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y ripgrep; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "ripgrep install failed (attempt $attempt); retrying in $((20 * attempt))s"
            sleep $((20 * attempt))
          done
          rg --version

      - name: Ensure ripgrep is installed (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          # Measured: "Failed to download resource ripgrep" failed a PR run.
          for attempt in 1 2 3; do
            if brew install ripgrep; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "ripgrep install failed (attempt $attempt); retrying in $((20 * attempt))s"
            sleep $((20 * attempt))
          done
          rg --version

      - name: Ensure ripgrep is installed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command rg -ErrorAction SilentlyContinue) {
            rg --version
            exit 0
          }
          # Measured: a community.chocolatey.org 504 failed a PR run.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ripgrep -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Host "ripgrep install failed (attempt $attempt); retrying in $(20 * $attempt)s"
            Start-Sleep -Seconds (20 * $attempt)
          }
          rg --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Run release metadata check
        run: npm run release:check -- --metadata-only

      - name: Verify a fresh headless browser without an account
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run smoke:browser

      - name: Run release verification
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run release:verify

      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node }}
          path: test-results/vitest.json
          if-no-files-found: warn
