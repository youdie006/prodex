name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-verify:
    name: release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          # The runner image usually ships ripgrep already; installing it again
          # cost two runs their entire budget when apt-get update hung and the
          # job was killed at the 20-minute timeout with nothing built.
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present: $(rg --version | head -1)"
            exit 0
          fi
          timeout 300 sudo apt-get update || echo "apt-get update timed out; trying the install anyway"
          timeout 300 sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run release metadata check
        run: npm run release:check

      - name: Run release verification
        run: npm run release:verify
