name: Publish

# Publish to npm from CI with no long-lived token. Auth is npm "trusted
# publishing" (OIDC): npmjs.com is configured to trust this repo + workflow, so
# GitHub's short-lived OIDC identity authenticates the publish and `--provenance`
# attaches a verifiable provenance attestation. No NPM_TOKEN secret is stored.
#
# Release flow: bump version + CHANGELOG on main, then push a matching tag:
#   git tag v0.8.2 && git push origin v0.8.2
# The tag must equal "v<version from package.json>" or the job fails before
# publishing. `workflow_dispatch` publishes the current package.json version.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  # contents: write so the tag also gets a GitHub Release - npm was being
  # published while the repo's Releases page sat 8 versions behind (0.11.0),
  # so anyone browsing GitHub saw a stale "latest".
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Upgrade npm for trusted publishing (OIDC)
        # Pinned to the 11.x line: OIDC trusted publishing needs npm >= 11.5.1,
        # and npm@latest bit us when 12.0.0 shipped with a broken provenance
        # path (publish --dry-run dies with MODULE_NOT_FOUND: sigstore) and a
        # changed `pack --json` shape. Bump deliberately, not implicitly.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Release verification
        run: npm run release:verify

      - name: Publish (provenance, trusted publishing)
        run: npm publish --provenance --access public --ignore-scripts

      - name: GitHub Release from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Take the section for this version out of CHANGELOG.md; fall back to
          # a pointer rather than failing the publish that already succeeded.
          notes="$(awk -v v="## [$version]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf "%s" "$notes" | tr -d "[:space:]")" ]; then
            notes="See CHANGELOG.md for $version."
          fi
          printf "%s\n" "$notes" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "prodex $version" --notes-file /tmp/release-notes.md
